name: Build APK
on:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Web folder
        run: |
          mkdir www
          cp index.html data.json manifest.webmanifest icon.svg icon-192.png icon-512.png apple-touch-icon.png www/
      - name: Android project
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr A-Z a-z)
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/status-bar@6
          npx cap init "Inv Tracker" com.mywealth.app --web-dir www
          PAGE="https://$OWNER.github.io/${{ github.event.repository.name }}/" node -e "const fs=require('fs'),f='capacitor.config.json',c=JSON.parse(fs.readFileSync(f));c.server={url:process.env.PAGE,androidScheme:'https'};c.backgroundColor='#08060f';c.plugins={StatusBar:{style:'DARK',backgroundColor:'#08060f',overlaysWebContent:false}};fs.writeFileSync(f,JSON.stringify(c,null,2))"
          npx cap add android
          npx cap sync android
      - name: App icon
        run: |
          R=android/app/src/main/res
          for p in mdpi:48:108 hdpi:72:162 xhdpi:96:216 xxhdpi:144:324 xxxhdpi:192:432; do
            IFS=: read d a f <<< "$p"
            cp ic_$a.png $R/mipmap-$d/ic_launcher.png
            cp ic_$a.png $R/mipmap-$d/ic_launcher_round.png
            cp fg_$f.png $R/mipmap-$d/ic_launcher_foreground.png
          done
          mkdir -p $R/mipmap-anydpi-v26
          printf '<?xml version="1.0" encoding="utf-8"?>\n<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n  <background android:drawable="@color/ic_launcher_background"/>\n  <foreground android:drawable="@mipmap/ic_launcher_foreground"/>\n</adaptive-icon>\n' > $R/mipmap-anydpi-v26/ic_launcher.xml
          cp $R/mipmap-anydpi-v26/ic_launcher.xml $R/mipmap-anydpi-v26/ic_launcher_round.xml
          printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n  <color name="ic_launcher_background">#1a0f3d</color>\n</resources>\n' > $R/values/ic_launcher_background.xml
      - name: Status bar color
        run: |
          F=android/app/src/main/res/values/styles.xml
          sed -i 's#</style>#    <item name="android:statusBarColor">\#08060f</item>\n    <item name="android:navigationBarColor">\#08060f</item>\n</style>#' $F
          cat $F | head -30
      - name: Build
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: my-wealth-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
