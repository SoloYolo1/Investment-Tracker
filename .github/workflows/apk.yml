name: Build APK
on:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Web folder
        run: |
          mkdir www
          cp index.html data.json manifest.webmanifest icon.svg icon-192.png icon-512.png apple-touch-icon.png www/
      - name: Android project
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr A-Z a-z)
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "My Wealth" com.mywealth.app --web-dir www
          PAGE="https://$OWNER.github.io/${{ github.event.repository.name }}/" node -e "const fs=require('fs'),f='capacitor.config.json',c=JSON.parse(fs.readFileSync(f));c.server={url:process.env.PAGE,androidScheme:'https'};fs.writeFileSync(f,JSON.stringify(c,null,2))"
          npx cap add android
          npx cap sync android
      - name: App icon
        run: |
          R=android/app/src/main/res
          rm -rf $R/mipmap-anydpi-v26
          for p in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do d=${p%%:*}; z=${p##*:}; for n in ic_launcher ic_launcher_round ic_launcher_foreground; do cp ic_$z.png $R/mipmap-$d/$n.png; done; done
      - name: Build
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: my-wealth-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
