name: Update NAV
on:
  schedule:
    - cron: "*/10 11-18 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python fetch_nav.py
      - run: |
          git config user.name "nav-bot"
          git config user.email "nav-bot@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || (git commit -m "NAV update" && git push)
